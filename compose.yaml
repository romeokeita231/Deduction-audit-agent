services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: deduction_audit
      POSTGRES_USER: deduction
      POSTGRES_PASSWORD: deduction
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deduction -d deduction_audit"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
